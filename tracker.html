<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tracker · BunkSmart</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/tracker.css" />
</head>
<body>

<!-- ══════════════════════════ NAVBAR ══════════════════════════ -->
<nav class="navbar">
  <a class="navbar__brand" href="index.html">
    <span class="navbar__brand-icon">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
           stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
        <path d="M6 12v5c3 3 9 3 12 0v-5"/>
      </svg>
    </span>
    BunkSmart
  </a>
  <ul class="navbar__nav">
    <li><a href="index.html">Home</a></li>
    <li><a href="timetable.html">Timetable</a></li>
    <li><a href="tracker.html" class="active">Tracker</a></li>
    <li><a href="dashboard.html">Dashboard</a></li>
  </ul>
  <span class="navbar__clock" id="navbar-clock"></span>
</nav>


<!-- ══════════════════════════ HEADER ══════════════════════════ -->
<header class="tracker-header">
  <div class="container" style="position:relative;z-index:1">
    <div class="header-eyebrow" style="color:var(--clr-safe)">📋 Attendance Tracker</div>
    <h1 class="page-header__title">
      Track Smart, Stay Safe
    </h1>
    <p class="page-header__subtitle">Mark your attendance and see if you can afford to skip.</p>
  </div>
</header>


<!-- ══════════════════════════ MAIN ══════════════════════════ -->
<main style="padding:2rem 0 4rem">
  <div class="container">

    <!-- Summary bar -->
    <div class="summary-bar" id="summary-bar"></div>

    <!-- Section heading -->
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--space-5);flex-wrap:wrap;gap:var(--space-3)">
      <div>
        <div class="section-title" style="font-size:var(--fs-lg);font-weight:700;color:var(--clr-text);letter-spacing:-0.02em">
          Your Subjects
        </div>
        <div style="font-size:var(--fs-xs);color:var(--clr-text-muted);margin-top:2px">
          Tap ✅ Present or ❌ Absent after each class
        </div>
      </div>
      <button class="btn btn--ghost btn--sm" onclick="window.clearAll()">🗑 Reset All</button>
    </div>

    <!-- Course cards grid -->
    <div class="course-grid" id="course-grid"></div>

    <!-- Attendance log -->
    <div>
      <div class="section-title" style="font-size:var(--fs-lg);font-weight:700;color:var(--clr-text);letter-spacing:-0.02em;margin-bottom:var(--space-4)">
        📜 Recent Log
      </div>
      <div class="history-log" id="history-log">
        <div style="text-align:center;padding:var(--space-8);color:var(--clr-text-dim);font-size:var(--fs-sm)">
          Mark attendance above to see your log here ✨
        </div>
      </div>
    </div>

  </div>
</main>


<!-- ══════════════════════════ PREDICT MODAL ══════════════════════════ -->
<div class="predict-modal" id="predict-modal">
  <div class="predict-box" id="predict-box-content"></div>
</div>


<!-- Toast -->
<div class="toast-container" id="toast-container"></div>


<script type="module" src="js/tracker.js"></script>
</body>
</html>
