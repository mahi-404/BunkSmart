<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard · BunkSmart</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/dashboard.css" />

  <!-- Chart.js CDN (canvas doughnut) -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>
</head>
<body>

<!-- ══════════════════════════ NAVBAR ══════════════════════════ -->
<nav class="navbar">
  <a class="navbar__brand" href="index.html">
    <span class="navbar__brand-icon">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
           stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
        <path d="M6 12v5c3 3 9 3 12 0v-5"/>
      </svg>
    </span>
    BunkSmart
  </a>
  <ul class="navbar__nav">
    <li><a href="index.html">Home</a></li>
    <li><a href="timetable.html">Timetable</a></li>
    <li><a href="tracker.html">Tracker</a></li>
    <li><a href="dashboard.html" class="active">Dashboard</a></li>
  </ul>
  <span class="navbar__clock" id="navbar-clock"></span>
</nav>


<!-- ══════════════════════════ HEADER ══════════════════════════ -->
<header class="dash-header">
  <div class="container" style="position:relative;z-index:1">
    <div class="header-eyebrow" style="color:var(--clr-accent)">📊 Overview</div>
    <h1 class="page-header__title">
      Your Dashboard
    </h1>
    <p class="page-header__subtitle">All 6 subjects. One bird's-eye view.</p>
  </div>
</header>


<!-- ══════════════════════════ MAIN ══════════════════════════ -->
<main style="padding:2rem 0 4rem">
  <div class="container">

    <!-- Alert banner (shown only when danger subjects exist) -->
    <div class="alert-banner" id="alert-banner" style="display:none">
      <div class="alert-banner__icon">🚨</div>
      <div class="alert-banner__text" id="alert-text">Some subjects need urgent attention!</div>
      <span class="alert-banner__close" onclick="this.parentElement.style.display='none'">✕</span>
    </div>

    <!-- Metrics row -->
    <div class="metrics-row" id="metrics-row"></div>

    <!-- Status breakdown -->
    <div class="status-breakdown" id="status-breakdown"></div>

    <!-- Main grid: course list + chart -->
    <div class="dash-main">

      <!-- Left: course list -->
      <div>
        <div style="font-size:var(--fs-lg);font-weight:700;color:var(--clr-text);letter-spacing:-0.02em;margin-bottom:var(--space-4)">
          📚 Subject Breakdown
        </div>
        <div class="course-list" id="course-list"></div>
      </div>

      <!-- Right: doughnut chart -->
      <div class="chart-panel">
        <div class="chart-panel-title">
          <span>Attendance Distribution</span>
          <span class="badge badge--info">All subjects</span>
        </div>
        <div class="chart-canvas-wrap">
          <canvas id="att-chart" height="260"></canvas>
          <div class="chart-centre">
            <div class="chart-centre__val" id="chart-avg">—</div>
            <div class="chart-centre__lbl">avg %</div>
          </div>
        </div>
        <div class="chart-legend" id="chart-legend"></div>
      </div>

    </div>

  </div>
</main>


<!-- Toast -->
<div class="toast-container" id="toast-container"></div>


<script type="module" src="js/dashboard.js"></script>
</body>
</html>
